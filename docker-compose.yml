services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: oiltrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oiltrace_db
      POSTGRES_USER: oiltrace
      POSTGRES_PASSWORD: oiltrace_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oiltrace -d oiltrace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oiltrace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://oiltrace:oiltrace_secure_pass@postgres:5432/oiltrace_db
      - SECRET_KEY=oiltrace_super_secret_jwt_key_2026_marine_decision_support_prototype
      - APP_ENV=production
      - DATA_DIR=/app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./ml:/app/ml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oiltrace-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  pgdata:
